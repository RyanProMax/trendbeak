<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7561b4" />
    <title>暂时无法连接 | Stock Daily</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        min-width: 320px;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(28px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        color: #343344;
        background: #faf9fc;
        font-family: system-ui, sans-serif;
      }
      main { width: min(100%, 540px); border-top: 4px solid; border-image: linear-gradient(90deg,#df8798,#e7b06e,#7dbbaf,#82a8d6,#b194d3) 1; padding-top: 28px; }
      .mark { display: grid; width: 64px; height: 64px; place-items: center; color: #faf9fc; background: #7561b4; border-radius: 12px; font-size: 24px; font-style: italic; font-weight: 700; }
      h1 { margin: 34px 0 12px; font-size: clamp(34px, 9vw, 58px); line-height: 1; letter-spacing: -.035em; }
      p { margin: 0; color: #796c8b; font-size: 17px; line-height: 1.7; }
      a { display: inline-block; margin-top: 30px; color: #7561b4; font: 700 14px/1.2 ui-sans-serif, system-ui, sans-serif; }
      @media (prefers-color-scheme: dark) {
        body { color: #edf2ed; background: #17131e; }
        p { color: #bcb2ca; }
        a { color: #c5b3e6; }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/favicon.svg?v=4" alt="" />
      <h1>暂时无法连接</h1>
      <p>连接恢复后，重新载入查看最新行情。</p>
      <a href="/">重新载入</a>
    </main>
  </body>
</html>
