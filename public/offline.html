<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>(()=>{let s;try{s=localStorage.getItem("trendbeak-theme")}catch{}if(s!=="light"&&s!=="dark")s=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.dataset.theme=s;document.querySelector('meta[name="theme-color"]').content=s==="dark"?"#000000":"#ffffff"})()</script>
    <title>暂时无法连接 | trendbeak</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; caret-color: transparent; }
      body {
        min-width: 320px;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(28px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        color: #252525;
        background: #ffffff;
        font-family: system-ui, sans-serif;
      }
      main { width: min(100%, 540px); border-top: 1px solid #e9e9e8; padding-top: 28px; }
      .mark { display: grid; width: 64px; height: 64px; place-items: center; color: #252525; background: transparent; border-radius: 12px; font-size: 24px; font-style: italic; font-weight: 700; }
      h1 { margin: 34px 0 12px; font-size: clamp(34px, 9vw, 58px); line-height: 1; letter-spacing: -.035em; }
      p { margin: 0; color: #666666; font-size: 17px; line-height: 1.7; }
      a { display: inline-block; margin-top: 30px; color: #555555; font: 700 14px/1.2 ui-sans-serif, system-ui, sans-serif; }
      :root[data-theme="dark"] { color-scheme:dark; }
      :root[data-theme="dark"] body { color:#eeeeee; background:#000000; }
      :root[data-theme="dark"] p { color:#aaaaaa; }
      :root[data-theme="dark"] a { color:#cccccc; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) body { color: #eeeeee; background: #000000; }
        :root:not([data-theme="light"]) p { color: #aaaaaa; }
        :root:not([data-theme="light"]) a { color: #cccccc; }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/favicon.svg?v=11" alt="" />
      <h1>暂时无法连接</h1>
      <p>连接恢复后，重新载入查看最新行情。</p>
      <a href="/">重新载入</a>
    </main>
  </body>
</html>
