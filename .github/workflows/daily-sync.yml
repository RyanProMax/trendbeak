name: Daily market synchronization
on:
  schedule:
    - cron: '37 8 * * 1-5'
    - cron: '37 3 * * 2-6'
    # Low-frequency recovery checks, including weekends and holidays. Complete
    # snapshots skip source requests; GitHub can still delay/drop these events.
    - cron: '17 12 * * *'
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      market:
        type: choice
        options: [CN, US]
        required: true
        default: CN
permissions:
  contents: read
# Both markets and manual dispatch share one writer queue. Never cancel a write in flight.
concurrency:
  group: trendbeak-daily-writer
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      DAILY_SYNC_ENABLED: ${{ vars.DAILY_SYNC_ENABLED }}
      SYNC_EVENT: ${{ github.event_name }}
      MARKET: ${{ github.event_name == 'workflow_dispatch' && inputs.market || (github.event.schedule == '37 3 * * 2-6' && 'US' || 'CN') }}
      SYNC_MODE: ${{ (github.event.schedule == '17 12 * * *' || github.event.schedule == '17 20 * * *') && 'catch_up' || 'primary' }}
    steps:
      - name: Require an existing authorized database credential
        id: connection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$SYNC_EVENT" = 'schedule' ] && [ "$DAILY_SYNC_ENABLED" != 'true' ]; then
            echo '::error::Daily sync is disabled. Configure the existing authorized database credential and account, then set DAILY_SYNC_ENABLED=true. No data was updated.'
            exit 1
          fi
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing existing account configuration'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'No existing database credential; synchronization is not enabled'; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Freeze the shared settlement clock
        id: clock
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Update bounded source windows and prepared responses
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$SYNC_EVENT" = 'workflow_dispatch' ]; then
            node scripts/verify-daily-connection.mjs
          fi
          args=(--market "$MARKET" --remote --at "${{ steps.clock.outputs.at }}")
          if [ "$SYNC_MODE" = 'catch_up' ]; then args+=(--catch-up); fi
          node scripts/daily-sync.mjs "${args[@]}"
      - name: Update bounded market factors and index valuations
        if: ${{ !cancelled() && steps.connection.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          args=(--market "$MARKET" --remote --at "${{ steps.clock.outputs.at }}")
          if [ "$SYNC_MODE" = 'catch_up' ]; then args+=(--catch-up); fi
          node scripts/overview-job.mjs "${args[@]}"
      - name: Check new quarterly ETF filings and append only audited releases
        id: etf_quarterly
        if: ${{ !cancelled() && steps.connection.outcome == 'success' && env.MARKET == 'US' && env.SYNC_MODE == 'primary' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/us-etf-quarterly-job.mjs --remote --write --at "${{ steps.clock.outputs.at }}" --output "$RUNNER_TEMP/etf-quarterly-review"
      - name: Retain bounded quarterly review candidates and pre-append backup
        if: ${{ !cancelled() && steps.etf_quarterly.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: etf-quarterly-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/etf-quarterly-review/
          retention-days: 7
          if-no-files-found: ignore
